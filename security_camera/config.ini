[detection]
# Motion detection threshold (0-100, lower = more sensitive)
threshold = 25
# Minimum contour area (square pixels, filters out small movements)
min_contour_area = 5000
# Cooldown duration (seconds)
cooldown = 30

[storage]
# Folder where captured photos will be saved
captures_dir = captures
# Log file
log_file = security_log.txt
